<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1 id="title">TestApp</h1>

        <div class="card">
            <h2>Регистрация</h2>

            <form id="registerForm">
                <input
                    id="email"
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    id="password"
                    type="password"
                    placeholder="Пароль"
                    required
                    minlength="6"
                >

                <button type="submit">Зарегистрироваться</button>
            </form>

            <p id="message"></p>
        </div>

    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
