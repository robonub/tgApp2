<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать товар</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
    <nav class="nav-tabs">
        <a href="home.html" class="tab">Главная</a>
        <a href="profile.html" class="tab">Профиль</a>
        <a href="myProducts.html" class="tab">Мои товары</a>
    </nav>
</header>

<div class="layout">
    <aside class="sidebar">
        <p id="userInfo">Загрузка...</p>
    </aside>

    <main class="content">
        <h1>Редактировать товар</h1>

        <form id="editForm">
            <div>
                <label for="title">Название:</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div>
                <label for="description">Описание:</label>
                <textarea id="description" name="description" required></textarea>
            </div>

            <div>
                <label for="price">Цена:</label>
                <input type="number" id="price" name="price" step="0.01" required>
            </div>

            <div id="currentImages">
                <p>Текущие изображения:</p>
            </div>

            <div>
                <label for="newImages">Добавить новые изображения:</label>
                <input type="file" id="newImages" name="newImages" multiple accept="image/*">
            </div>


            <button type="submit">Сохранить изменения</button>
            <button type="button" id="cancelBtn">Отмена</button>
        </form>

        <p id="message"></p>
    </main>
</div>

<script src="js/editProduct.js"></script>

</body>
</html>
